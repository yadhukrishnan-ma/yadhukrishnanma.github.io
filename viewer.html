<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daksha — Camera Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090d;--surface:#0d1117;--card:#111827;--border:#1e2d3d;--cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.15);--cyan-glow:rgba(0,229,255,0.40);--green:#00e676;--red:#ff1744;--yellow:#ffd000;--text:#e6edf3;--muted:#6e7681;--font:'Outfit',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
    header{background:rgba(13,17,23,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .brand-dot{width:10px;height:10px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan);animation:pdot 2.4s ease-in-out infinite;}
    @keyframes pdot{0%,100%{opacity:1;box-shadow:0 0 12px var(--cyan);}50%{opacity:0.5;box-shadow:0 0 4px var(--cyan);}}
    .brand-name{font-size:17px;font-weight:800;letter-spacing:0.12em;color:var(--cyan);text-shadow:0 0 18px var(--cyan-glow);}
    .brand-sub{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0.08em;}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
    .lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
    .inp{background:var(--card);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;font-weight:700;padding:6px 10px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
    .inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim);}
    #robotInput{width:70px;text-transform:lowercase;}
    #userInput{width:88px;}
    #passInput{width:100px;}
    #connectBtn{background:var(--cyan);color:var(--bg);border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:0.06em;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:opacity 0.2s,transform 0.1s,box-shadow 0.2s;}
    #connectBtn:hover{opacity:0.88;box-shadow:0 0 18px var(--cyan-glow);}
    #connectBtn:active{transform:scale(0.96);}
    #connectBtn:disabled{opacity:0.5;cursor:not-allowed;}
    #statusBar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;font-family:var(--mono);color:var(--muted);flex-wrap:wrap;}
    #statusDot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s,box-shadow 0.3s;}
    #statusDot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.6s ease-in-out infinite;}
    #statusDot.error{background:var(--red);box-shadow:0 0 8px var(--red);}
    #statusDot.auth{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:blink 0.8s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
    #statusText{flex:1;min-width:0;}
    #fpsDisplay{font-size:11px;color:var(--muted);}
    main{flex:1;padding:16px 14px 22px;}
    .cam-grid{display:grid;grid-template-columns:1fr;gap:14px;}
    @media(min-width:700px){.cam-grid{grid-template-columns:repeat(3,1fr);}}
    .cam-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.3s,box-shadow 0.3s;}
    .cam-card.active{border-color:var(--cyan);box-shadow:0 0 22px rgba(0,229,255,0.18),inset 0 0 0 1px rgba(0,229,255,0.08);}
    .cam-label{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.35);border-bottom:1px solid var(--border);}
    .cam-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
    .cam-icon{font-size:14px;filter:drop-shadow(0 0 4px var(--cyan));}
    .cam-sub{font-size:9px;color:var(--muted);font-weight:500;}
    .cam-badge{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--muted);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:5px;padding:2px 7px;letter-spacing:0.06em;}
    .cam-badge.live-badge{color:var(--green);border-color:var(--green);background:rgba(0,230,118,0.08);}
    .cam-view{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;}
    .cam-view img{width:100%;height:100%;object-fit:cover;display:block;}
    .cam-offline{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,0.82);backdrop-filter:blur(4px);}
    .cam-offline-icon{font-size:28px;opacity:0.4;}
    .cam-offline-text{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
    .cam-view::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px);}
    .cam-corner{position:absolute;width:12px;height:12px;border-color:var(--cyan);border-style:solid;opacity:0.6;pointer-events:none;}
    .cam-corner.tl{top:6px;left:6px;border-width:2px 0 0 2px;}
    .cam-corner.tr{top:6px;right:6px;border-width:2px 2px 0 0;}
    .cam-corner.bl{bottom:6px;left:6px;border-width:0 0 2px 2px;}
    .cam-corner.br{bottom:6px;right:6px;border-width:0 2px 2px 0;}
    footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);font-size:11px;font-family:var(--mono);color:var(--muted);gap:10px;flex-wrap:wrap;}
    #robotLabel{color:var(--cyan);font-weight:700;}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div><div class="brand-name">DAKSHA</div><div class="brand-sub">CAMERA VIEWER</div></div>
    </div>
    <div class="controls">
      <span class="lbl">Robot</span>
      <input class="inp" id="robotInput" type="text" value="s1" maxlength="12" placeholder="s1" autocomplete="off" spellcheck="false"/>
      <span class="lbl">User</span>
      <input class="inp" id="userInput"  type="text"     value="ihub"    maxlength="40" autocomplete="off"/>
      <span class="lbl">Pass</span>
      <input class="inp" id="passInput"  type="password" value="ihub_ihr" maxlength="60" autocomplete="off"/>
      <button id="connectBtn">CONNECT</button>
    </div>
  </header>

  <div id="statusBar">
    <div id="statusDot"></div>
    <span id="statusText">Enter Robot ID and press CONNECT</span>
    <span id="fpsDisplay"></span>
  </div>

  <main>
    <div class="cam-grid">
      <div class="cam-card" id="card-world">
        <div class="cam-label">
          <div class="cam-title"><span class="cam-icon">🌐</span>WORLD CAM<span class="cam-sub">(CHEST)</span></div>
          <span class="cam-badge" id="badge-world">OFFLINE</span>
        </div>
        <div class="cam-view">
          <img id="img-world" src="" alt="" style="display:none;"/>
          <div class="cam-offline" id="offline-world"><div class="cam-offline-icon">🌐</div><div class="cam-offline-text">Awaiting feed</div></div>
          <div class="cam-corner tl"></div><div class="cam-corner tr"></div><div class="cam-corner bl"></div><div class="cam-corner br"></div>
        </div>
      </div>
      <div class="cam-card" id="card-wrist_l">
        <div class="cam-label">
          <div class="cam-title"><span class="cam-icon">🤖</span>WRIST L<span class="cam-sub">(LEFT)</span></div>
          <span class="cam-badge" id="badge-wrist_l">OFFLINE</span>
        </div>
        <div class="cam-view">
          <img id="img-wrist_l" src="" alt="" style="display:none;"/>
          <div class="cam-offline" id="offline-wrist_l"><div class="cam-offline-icon">🤖</div><div class="cam-offline-text">Awaiting feed</div></div>
          <div class="cam-corner tl"></div><div class="cam-corner tr"></div><div class="cam-corner bl"></div><div class="cam-corner br"></div>
        </div>
      </div>
      <div class="cam-card" id="card-wrist_r">
        <div class="cam-label">
          <div class="cam-title"><span class="cam-icon">🦾</span>WRIST R<span class="cam-sub">(RIGHT)</span></div>
          <span class="cam-badge" id="badge-wrist_r">OFFLINE</span>
        </div>
        <div class="cam-view">
          <img id="img-wrist_r" src="" alt="" style="display:none;"/>
          <div class="cam-offline" id="offline-wrist_r"><div class="cam-offline-icon">🦾</div><div class="cam-offline-text">Awaiting feed</div></div>
          <div class="cam-corner tl"></div><div class="cam-corner tr"></div><div class="cam-corner bl"></div><div class="cam-corner br"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>DAKSHA ROBOTICS · CAMERA VIEWER</span>
    <span>ROBOT: <span id="robotLabel">—</span> · daksha-v1.onrender.com</span>
  </footer>

  <script>
  (function(){
    'use strict';
    var API='https://daksha-v1.onrender.com';

    // Map every camera_id the server might send → card key
    var CAM_MAP={
      'world':'world','world_camera':'world','chest':'world',
      'left_wrist':'wrist_l','wrist_left':'wrist_l','zed_left':'wrist_l',
      'right_wrist':'wrist_r','wrist_right':'wrist_r','zed_right':'wrist_r',
    };

    var ws=null,robotId='',token='',connected=false;
    var frameCount=0,lastFpsTime=performance.now(),fpsTimer=null;
    var camActive={world:false,wrist_l:false,wrist_r:false};

    var $ = function(id){ return document.getElementById(id); };
    var robotInput=$('robotInput'), userInput=$('userInput'), passInput=$('passInput');
    var connectBtn=$('connectBtn'), statusDot=$('statusDot'), statusText=$('statusText');
    var fpsDisplay=$('fpsDisplay'), robotLabel=$('robotLabel');

    function setStatus(cls,txt){ statusDot.className=cls; statusText.textContent=txt; }

    function badge(k,live){
      var b=$('badge-'+k), c=$('card-'+k);
      if(!b||!c) return;
      b.textContent=live?'LIVE':'OFFLINE';
      b.className='cam-badge'+(live?' live-badge':'');
      live?c.classList.add('active'):c.classList.remove('active');
    }

    function showFeed(k,b64){
      var img=$('img-'+k), off=$('offline-'+k);
      if(!img) return;
      img.src='data:image/jpeg;base64,'+b64;
      img.style.display='block'; off.style.display='none';
      if(!camActive[k]){ camActive[k]=true; badge(k,true); }
      frameCount++;
    }

    function resetCam(k){
      var img=$('img-'+k), off=$('offline-'+k);
      if(!img) return;
      img.style.display='none'; img.src=''; off.style.display='';
      camActive[k]=false; badge(k,false);
    }

    function resetAll(){ ['world','wrist_l','wrist_r'].forEach(resetCam); }

    function startFps(){
      fpsTimer=setInterval(function(){
        var fps=Math.round(frameCount/((performance.now()-lastFpsTime)/1000));
        fpsDisplay.textContent=connected?fps+' fps':'';
        frameCount=0; lastFpsTime=performance.now();
      },1000);
    }
    function stopFps(){ clearInterval(fpsTimer); fpsDisplay.textContent=''; frameCount=0; }

    function parseBody(raw){
      // raw can be: a string (JSON), an object, or undefined
      if(!raw) return null;
      if(typeof raw === 'object') return raw;
      if(typeof raw === 'string'){
        try{ return JSON.parse(raw); } catch(e){ return null; }
      }
      return null;
    }

    function handleMsg(evt){
      var data;
      try{ data=JSON.parse(evt.data); } catch(e){ return; }

      // Format: {"type":"event","action":"camera","body":"<JSON string or object>"}
      if(data.action !== 'camera') return;

      var body = parseBody(data.body);
      if(!body) return;

      var camId = body.camera_id || body.cam_id || '';
      var cardKey = CAM_MAP[camId] || null;
      if(!cardKey) return;

      var b64 = body.image || body.frame || body.data || '';
      if(!b64) return;

      showFeed(cardKey, b64);
    }

    function doLogin(cb){
      setStatus('auth','Authenticating...');
      var xhr=new XMLHttpRequest();
      xhr.open('POST',API+'/login/json',true);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.timeout=15000;
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var r=JSON.parse(xhr.responseText);
            token=r.access_token||r.token||'';
            token?cb(null):cb('No token in response');
          }catch(e){ cb('Invalid login response'); }
        } else { cb('Login HTTP '+xhr.status); }
      };
      xhr.onerror=function(){ cb('Network error'); };
      xhr.ontimeout=function(){ cb('Login timed out'); };
      xhr.send(JSON.stringify({username:userInput.value.trim()||'ihub',password:passInput.value||'ihub_ihr'}));
    }

    function openWS(){
      if(ws){ ws.onclose=null; ws.close(); ws=null; }
      var url='wss://daksha-v1.onrender.com/ws?robot_id='+encodeURIComponent(robotId)+'&token='+encodeURIComponent(token);
      setStatus('','Connecting...');
      try{ ws=new WebSocket(url); } catch(e){ setStatus('error','WS: '+e.message); resetBtn(); return; }

      ws.onopen=function(){
        connected=true;
        setStatus('live','Connected — robot '+robotId);
        connectBtn.textContent='DISCONNECT'; connectBtn.disabled=false;
        startFps();
      };
      ws.onmessage=handleMsg;
      ws.onclose=function(evt){
        connected=false; stopFps(); resetAll();
        setStatus('error','Disconnected ('+evt.code+') — press CONNECT to retry');
        resetBtn();
        if(evt.code!==1000 && robotId){
          setTimeout(function(){ if(!connected&&robotId) connect(); },4000);
        }
      };
      ws.onerror=function(){ setStatus('error','Connection error'); };
    }

    function resetBtn(){ connectBtn.textContent='CONNECT'; connectBtn.disabled=false; }

    function connect(){
      robotId=(robotInput.value||'').trim().toLowerCase();
      if(!robotId){ setStatus('error','Enter a robot ID'); return; }
      connectBtn.textContent='CONNECTING...'; connectBtn.disabled=true;
      robotLabel.textContent=robotId.toUpperCase();
      resetAll();
      doLogin(function(err){
        if(err){ setStatus('error','Auth: '+err); resetBtn(); return; }
        openWS();
      });
    }

    function disconnect(){
      robotId='';
      if(ws){ ws.onclose=null; ws.close(); ws=null; }
      connected=false; token=''; stopFps(); resetAll();
      setStatus('','Disconnected'); resetBtn();
    }

    // Auto-detect robot from URL path (e.g. /s2) or query string (?robot=s2)
    try {
      var urlParams = new URLSearchParams(window.location.search);
      var qRobot = urlParams.get('robot') || urlParams.get('robot_id');
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var lastPart = pathParts[pathParts.length - 1];
      var detected = qRobot || (lastPart && !['viewer', 'index.html', 'teleop'].includes(lastPart.toLowerCase()) ? lastPart : '');
      if (detected) robotInput.value = detected;
    } catch(e) {}

    connectBtn.addEventListener('click',function(){ connected?disconnect():connect(); });
    robotInput.addEventListener('keydown',function(e){ if(e.key==='Enter') connect(); });
    passInput.addEventListener('keydown',function(e){ if(e.key==='Enter') connect(); });
    document.addEventListener('visibilitychange',function(){
      if(!document.hidden&&ws&&ws.readyState===WebSocket.CLOSED&&robotId) connect();
    });
  })();
  </script>
</body>
</html>
